<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keepsake</title>
  <link rel="icon" href="../../icons/icon32.png" />
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <button class="btn btn-icon menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="scrim" id="scrim" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <a class="sidebar-brand" href="#home" aria-label="Keepsake home">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h10a1.5 1.5 0 0 1 1.5 1.5v15.2a.8.8 0 0 1-1.28.64L12 16.9l-5.22 3.94A.8.8 0 0 1 5.5 20.2V5A1.5 1.5 0 0 1 7 3.5Z" fill="currentColor"/></svg>
        </span>
        <span class="brand-name">Keepsake</span>
      </a>

      <nav class="nav" aria-label="Views">
        <a class="nav-item" href="#home" data-route="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6h-6v6H5.5A1.5 1.5 0 0 1 4 19v-8.5Z"/></svg>
          <span>Home</span>
        </a>
        <a class="nav-item" href="#all" data-route="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
          <span>Library</span><span class="count" id="countAll"></span>
        </a>
        <a class="nav-item" href="#favorites" data-route="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.8 2.5 5.3 5.8.7-4.3 4 1.1 5.8L12 16.8l-5.1 2.8 1.1-5.8-4.3-4 5.8-.7L12 3.8Z"/></svg>
          <span>Favorites</span><span class="count" id="countFav"></span>
        </a>
        <a class="nav-item" href="#purchased" data-route="purchased">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/><path d="m9.5 14 1.8 1.8 3.2-3.3"/></svg>
          <span>Purchased</span><span class="count" id="countPurchased"></span>
        </a>
        <a class="nav-item" href="#review" data-route="review" id="navReview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5l2.5 1.5"/></svg>
          <span>Review</span><span class="count" id="countReview"></span>
        </a>
        <!-- Lifestyle: places to go, food to make, videos to watch… one view per kind of save, folded into
             one group so the menu stays short. Open or closed is remembered in this browser. Shopping
             (products) lives under Collections instead. -->
        <div class="nav-group" id="navKindsGroup">
          <button class="nav-item nav-group-toggle" type="button" id="navKindsToggle" aria-expanded="false" aria-controls="navKindsList">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c-3 3-4.5 5.5-4.5 8a4.5 4.5 0 0 0 9 0c0-2.5-1.5-5-4.5-8ZM12 20.5v-5"/></svg>
            <span>Lifestyle</span><span class="count" id="countKindsGroup"></span>
            <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <div class="nav-group-list" id="navKindsList" hidden>
            <div class="nav-kinds" id="navKinds"></div>
            <p class="help nav-group-empty" id="navKindsEmpty" hidden>Save a recipe, place, video, workout, article, film or book and it shows up here.</p>
          </div>
        </div>
      </nav>

      <div class="sidebar-section">
        <!-- Collections (shopping) fold like Lifestyle: same row, same indented list with a bar. Closed, pinned
             collections (and the one you're on) stay listed, with the "All collections" row first. -->
        <div class="nav-group-row">
          <a class="nav-item nav-group-link" href="#collections" title="All collections, in the Library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
            <span>Collections</span>
          </a>
          <button class="btn btn-icon btn-quiet nav-group-chevron" type="button" id="collectionsToggle" aria-expanded="true" aria-controls="collectionList" aria-label="Show or hide collections">
            <svg class="nav-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <button class="btn btn-icon btn-quiet nav-group-add" id="newCollectionBtn" type="button" aria-label="New collection" title="New collection">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="nav-group-list collections-group">
        <ul class="collection-list" id="collectionList" aria-label="Collections"></ul>
        <p class="help sidebar-help" id="collectionHelp">Pin a collection to keep it on top</p>
        </div>
      </div>

      <nav class="nav nav-bottom" aria-label="Tools">
        <a class="nav-item" href="#import" data-route="import">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17" cy="7" r="1" fill="currentColor"/></svg>
          <span>Instagram import</span><span class="count" id="countImport"></span>
        </a>
        <a class="nav-item" href="#tabsimport" data-route="tabsimport">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9h17M8 5v4"/></svg>
          <span>Import from tabs</span>
        </a>
        <a class="nav-item" href="#settings" data-route="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>Settings</span>
        </a>
        <a class="nav-item" href="#trash" data-route="trash">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l1 12.5h9l1-12.5M9.5 7V4.5h5V7"/></svg>
          <span>Trash</span><span class="count" id="countTrash"></span>
        </a>
      </nav>
    </aside>

    <main class="main" id="main">
      <header class="toolbar" id="toolbar">
        <div class="toolbar-left">
          <h1 class="view-title" id="viewTitle">Home</h1>
          <span class="view-count muted small" id="viewCount"></span>
        </div>
        <div class="toolbar-right" id="toolbarControls">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
            <input class="input" id="searchInput" type="search" placeholder="Search your saves  ( / )" aria-label="Search" />
          </label>
          <button class="btn control hidden" id="aiCheck" type="button">Check with AI</button>
          <button class="btn control" id="selectToggle" type="button" aria-pressed="false">Select</button>
          <button class="btn btn-icon" id="themeToggle" type="button" aria-label="Toggle theme" title="Theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="jobbar hidden" id="jobbar" role="status" aria-live="polite"></div>

      <div class="bulkbar hidden" id="bulkbar" role="region" aria-label="Bulk actions">
        <span id="bulkCount">0 selected</span>
        <button class="btn btn-sm" id="bulkAll" type="button">Select all</button>
        <button class="btn btn-sm" id="bulkMove" type="button">Move to…</button>
        <button class="btn btn-sm" id="bulkFav" type="button">Favorite</button>
        <button class="btn btn-sm hidden" id="bulkAi" type="button">Find products (AI)</button>
        <button class="btn btn-sm btn-danger" id="bulkDelete" type="button">Delete</button>
        <span class="grow"></span>
        <button class="btn btn-sm btn-quiet" id="bulkCancel" type="button">Done</button>
      </div>

      <section class="view" id="view" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="../instagram/adapter.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
